name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bicycle geometry check
        run: node js/bike.test.mjs
      - name: Hand rig check
        run: node js/hand.test.mjs
      - name: Grasp geometry check
        run: node js/grasp.test.mjs
      - name: Contact form helpers
        run: node js/contact.test.mjs
      - name: Stage-guard leak and key checks
        run: node tools/stage-guard.test.mjs
      - name: Stage public files and verify every reference resolves
        run: node tools/stage.mjs _site
        env:
          PUBLISH_CNAME: '1'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
